<!doctype html>
<html>
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>太陽系模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* Layout: full-bleed WebGL scene; focus readout top-left, body chips + time controls bottom, name labels pinned to bodies. */
  :root {
    --bg: #04060b;
    --fg: #e7edf6;
    --muted: #8593a8;
    --accent: #6cc4ff;
    --warm: #ffc766;
    --panel: rgba(8, 13, 24, 0.62);
    --line: rgba(160, 190, 230, 0.2);
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage { position: fixed; inset: 0; z-index: 0; }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #scene.drag { cursor: grabbing; }
  header, footer { position: relative; z-index: 2; pointer-events: none; min-width: 0; }
  header { text-shadow: 0 0 6px rgba(2, 4, 10, 0.95), 0 1px 3px rgba(2, 4, 10, 0.9); }
  header > *, footer > * { pointer-events: auto; }
  #dock, .dock-row, .dockbar { pointer-events: none; }
  #dock > *, .dock-row > *, .dockbar > * { pointer-events: auto; }

  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; color: var(--accent); text-transform: uppercase; }
  h1 { margin: 2px 0 0; font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: 0.02em; text-wrap: balance; }
  #sub { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  #info.off { display: none; }
  dl.facts { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, auto)); gap: 6px 22px; width: max-content; max-width: 100%; pointer-events: none; }
  dl.facts div { min-width: 0; }
  dl.facts dt { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
  dl.facts dd { margin: 0; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  #fun { margin: 10px 0 0; max-width: 34ch; font-size: 12.5px; color: #c4d0e2; pointer-events: none; text-shadow: 0 1px 4px #000; }
  #credit { margin: 8px 0 0; max-width: 40ch; font-size: 10.5px; color: var(--muted); pointer-events: none; }
  @media (min-width: 640px) { dl.facts { grid-template-columns: repeat(3, minmax(0, auto)); } #fun { max-width: 46ch; } }

  .chips {
    display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; padding-bottom: 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    padding-inline: 14px; margin-inline: -14px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: 0 0 auto; }
  .chips button.moon { color: var(--muted); }
  .chips button.moon[aria-pressed="true"] { color: var(--accent); }

  .dockbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; min-width: 0; }
  #hint { display: none; font-size: 11.5px; color: var(--muted); text-shadow: 0 1px 3px #000, 0 0 8px #000; pointer-events: none; min-width: 0; }
  #dateMini { display: none; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000, 0 0 8px #000; pointer-events: none; }
  .dockbtns { margin-left: auto; display: flex; gap: 6px; flex: 0 0 auto; }
  #bDock, #bFull { flex: 0 0 auto; min-height: 34px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
  #toast { position: fixed; z-index: 6; left: 50%; bottom: 96px; transform: translate(-50%, 8px); max-width: min(92vw, 420px); padding: 8px 14px; border-radius: 6px; background: rgba(6, 10, 18, 0.88); border: 1px solid var(--line); font-size: 13px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #dock { animation: dockIn .22s ease-out; }
  @keyframes dockIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .dock-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .dock-row .controls { margin: 0; }
  .dock-row .time { flex: 1 1 360px; min-width: 0; }
  body.clean #dock, body.clean #sub, body.clean #info, body.clean #hint { display: none; }
  body.clean #dateMini { display: inline; }
  body.clean .dockbar { margin-bottom: 0; }
  body.clean h1 { margin-bottom: 0; }
  @media (hover: hover) and (pointer: fine) { #hint { display: block; } }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  button {
    font: inherit; color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 12px; min-height: 36px; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: border-color .15s, color .15s, background .15s;
  }
  button:hover { border-color: rgba(160, 200, 255, 0.45); }
  button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: rgba(108, 196, 255, 0.12); }
  button.action { color: var(--warm); border-color: rgba(255, 199, 102, 0.5); }
  button:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .time {
    display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .time .date { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 6.4em; }
  .time label { color: var(--muted); font-size: 12px; }
  .time output { font-family: var(--font-mono); font-size: 12px; min-width: 0; font-variant-numeric: tabular-nums; }
  .time input { flex: 1 1 120px; min-width: 100px; accent-color: var(--accent); }
  .time button { min-height: 30px; padding: 3px 10px; white-space: nowrap; flex: 0 0 auto; }

  #labels { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  #labels .lbl {
    position: absolute; left: 0; top: 0; pointer-events: auto;
    background: none; border: 0; border-radius: 0; min-height: 0; padding: 8px 10px 8px 15px;
    font-size: 12px; font-weight: 500; color: var(--fg); opacity: 0.88;
    text-shadow: 0 1px 3px #000, 0 0 8px #000; white-space: nowrap;
    backdrop-filter: none; -webkit-backdrop-filter: none; transition: opacity .2s;
    will-change: transform;
  }
  #labels .lbl::before { content: ""; position: absolute; left: 4px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
  #labels .lbl.sel { color: var(--warm); opacity: 1; }
  #labels .lbl.hide { opacity: 0; pointer-events: none; }
  #msg {
    position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; text-align: center;
    padding: 24px; background: var(--bg); color: var(--muted); font-family: var(--font-mono); font-size: 13px;
    transition: opacity .6s;
  }
  #msg.done { opacity: 0; pointer-events: none; }
  @media (max-width: 560px) {
    .chips { margin-bottom: 6px; }
    .dock-row { gap: 6px; }
    .controls { gap: 5px; }
    .controls button { padding: 4px 10px; min-height: 34px; }
    .time { gap: 6px 10px; padding: 6px 10px; }
    .time label { display: none; }
    .time .date { min-width: 0; }
    .time input { flex: 1 1 80px; min-width: 80px; }
    .time output { font-size: 11px; }
  }
  @media (pointer: coarse) {
    button { min-height: 40px; }
    .controls button { min-height: 38px; }
    .time button { min-height: 36px; padding: 3px 12px; }
    #bDock, #bFull { min-height: 38px; }
    #labels .lbl { padding: 12px 14px 12px 18px; }
    #labels .lbl::before { left: 6px; }
    .time input { height: 32px; }
  }
  @media (max-height: 520px) {
    #sub, #fun, #credit { display: none; }
    h1 { font-size: 18px; margin-bottom: 6px; }
    .chips { margin-bottom: 6px; }
    #hint { display: none !important; }
    body { padding-block: 8px; gap: 6px; }
    dl.facts { gap: 2px 18px; }
    .dock-row { align-items: center; }
    .dock-row .time { flex: 1 1 300px; flex-wrap: nowrap; }
    .time label { display: none; }
    .time input { min-width: 40px; }
    .time .date { font-size: 12px; }
    .time output { white-space: nowrap; }
    .controls button { min-height: 36px; }
    .dockbar { margin-bottom: 6px; }
  }
  @media (max-width: 420px) { h1 { font-size: 20px; } }
  @media (prefers-reduced-motion: reduce) { #msg, #labels .lbl { transition: none; } #dock { animation: none; } }
</style>

<div id="stage"><canvas id="scene" aria-label="可拖曳旋轉、雙指縮放的太陽系 3D 模型"></canvas></div>
<div id="labels"></div>
<div id="msg">載入天體貼圖…</div>
<div id="toast" role="status" aria-live="polite"></div>

<header>
  <div class="eyebrow" id="eyebrow">Solar System</div>
  <h1 id="name">太陽系</h1>
  <p id="sub">八大行星、矮行星冥王星與主要衛星</p>
  <div id="info">
    <dl class="facts" id="facts"></dl>
    <p id="fun"></p>
    <p id="credit">大小與距離皆經壓縮，軌道位置依真實軌道要素計算。貼圖來自 NASA、Solar System Scope、Planet Pixel Emporium 等。</p>
  </div>
</header>

<footer>
  <div class="dockbar">
    <span id="hint">← → 切換天體 空白鍵 暫停 H 收合介面 F 全螢幕 雙擊空白處回全景</span>
    <span id="dateMini" aria-hidden="true"></span>
    <div class="dockbtns">
      <button id="bFull" type="button" aria-pressed="false">全螢幕</button>
      <button id="bDock" type="button" aria-expanded="true" aria-controls="dock">收合介面 ▾</button>
    </div>
  </div>
  <div id="dock">
    <nav class="chips" id="chips" aria-label="選擇天體"></nav>
    <div class="dock-row">
      <div class="controls" role="group" aria-label="顯示選項">
        <button id="bOrbit" type="button" aria-pressed="true">軌道</button>
        <button id="bLabel" type="button" aria-pressed="true">名稱</button>
        <button id="bBelt" type="button" aria-pressed="true">小行星帶</button>
        <button id="bInfo" type="button" aria-pressed="true">資訊</button>
      </div>
      <div class="time">
        <span class="date" id="date">—</span>
        <button id="bPlay" type="button" aria-pressed="false">暫停</button>
        <button id="bNow" type="button" class="action">回到今天</button>
        <label for="speed">時間流速</label>
        <input id="speed" type="range" min="0" max="5" step="1" value="2">
        <output id="speedOut" for="speed"></output>
      </div>
    </div>
  </div>
</footer>
